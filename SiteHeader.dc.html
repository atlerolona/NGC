<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&amp;display=swap">
</helmet>
<header style="background: #F8F5EF; font-family: 'Nunito Sans', sans-serif; position: relative; z-index: 50; color: #1F2D27;">
  <div style="background: #214C39; color: #F8F5EF; font-size: 14px;">
    <div style="max-width: 1240px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 64px); display: flex; flex-wrap: wrap; gap: 0 24px; justify-content: space-between; align-items: center;">
      <span style="padding: 10px 0;">In crisis? Call or text <strong>988</strong> or dial 911.</span>
      <span style="display: flex; gap: 22px; flex-wrap: wrap; align-items: center;">
        <a href="https://www.therapyportal.com/p/therapy38/login/" style="color: #F8F5EF; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px;" style-hover="text-decoration: underline;">Pay Online</a>
        <a href="New-Patients.dc.html#contact" style="color: #F8F5EF; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px;" style-hover="text-decoration: underline;">Contact Us</a>
        <a href="tel:+15056394769" style="color: #F8F5EF; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px;">(505) 639-4769</a>
      </span>
    </div>
  </div>
  <nav aria-label="Main" style="max-width: 1240px; margin: 0 auto; padding: 18px clamp(20px, 5vw, 64px); display: flex; align-items: center; gap: 12px 30px; flex-wrap: wrap;">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1F2D27; margin-right: auto;">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"></path><path d="M10 20c5.5-2.5.8-6.4 3-10"></path><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"></path><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"></path></svg>
      <span style="display: flex; flex-direction: column; line-height: 1.05;">
        <span style="font-family: 'Newsreader', serif; font-size: 26px; font-weight: 500;">New Growth</span>
        <span style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #2F6B4F; font-weight: 700;">Counseling · Albuquerque</span>
      </span>
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; gap: 4px 28px; align-items: center;">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
          <li onMouseEnter="{{ g.enter }}" onMouseLeave="{{ g.leave }}" onFocus="{{ g.enter }}" onBlur="{{ g.blur }}" style="position: relative;">
            <a href="{{ g.href }}" aria-current="{{ g.current }}" aria-haspopup="{{ g.hasSub }}" aria-expanded="{{ g.expanded }}" style="{{ g.style }}" style-hover="color: #2F6B4F;">
              {{ g.label }}
              <sc-if value="{{ g.hasSub }}" hint-placeholder-val="{{ false }}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{ g.chevron }}"><path d="m6 9 6 6 6-6"></path></svg>
              </sc-if>
            </a>
            <sc-if value="{{ g.open }}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 100%; left: -24px; padding-top: 14px; min-width: 300px;">
                <ul style="list-style: none; margin: 0; padding: 10px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 18px 40px -12px rgba(33, 76, 57, 0.28), 0 2px 6px rgba(33, 76, 57, 0.08);">
                  <sc-for list="{{ g.children }}" as="c">
                    <li>
                      <a href="{{ c.href }}" aria-current="{{ c.current }}" style="display: flex; flex-direction: column; gap: 2px; padding: 11px 16px; border-radius: 10px; text-decoration: none; color: #1F2D27;" style-hover="background: #E3ECE3;">
                        <span style="font-size: 15.5px; font-weight: 700;">{{ c.label }}</span>
                        <span style="font-size: 14px; color: #55625C;">{{ c.sub }}</span>
                      </a>
                    </li>
                  </sc-for>
                </ul>
              </div>
            </sc-if>
          </li>
        </sc-for>
      </ul>
      <a href="New-Patients.dc.html#schedule" style="display: inline-flex; align-items: center; gap: 8px; background: #2F6B4F; color: #FFFFFF; font-size: 15px; font-weight: 700; padding: 12px 22px; border-radius: 999px; text-decoration: none;" style-hover="background: #214C39;">Schedule an Assessment</a>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button type="button" aria-expanded="{{ open }}" onClick="{{ toggle }}" style="display: inline-flex; align-items: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 700; padding: 10px 18px; min-height: 44px; border-radius: 999px; border: 1.5px solid #2F6B4F; background: transparent; color: #214C39; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>Menu
      </button>
    </sc-if>
  </nav>
  <sc-if value="{{ showPanel }}" hint-placeholder-val="{{ false }}">
    <div style="padding: 4px clamp(20px, 5vw, 64px) 28px; display: flex; flex-direction: column; background: #F8F5EF;">
      <sc-for list="{{ groups }}" as="g">
        <a href="{{ g.href }}" style="font-size: 17px; font-weight: 700; padding: 12px 0; border-bottom: 1px solid #DDD6CA; color: #1F2D27; text-decoration: none; min-height: 44px; box-sizing: border-box;">{{ g.label }}</a>
        <sc-for list="{{ g.children }}" as="c">
          <a href="{{ c.href }}" style="font-size: 16px; padding: 10px 0 10px 18px; border-bottom: 1px solid #DDD6CA; color: #43504A; text-decoration: none; min-height: 44px; box-sizing: border-box;">{{ c.label }}</a>
        </sc-for>
      </sc-for>
      <a href="New-Patients.dc.html#schedule" style="margin-top: 20px; display: flex; justify-content: center; background: #2F6B4F; color: #FFFFFF; font-size: 17px; font-weight: 700; padding: 15px 22px; border-radius: 999px; text-decoration: none;">Schedule an Assessment</a>
    </div>
  </sc-if>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <div role="region" aria-label="Quick contact" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: #FFFFFF; box-shadow: 0 -8px 24px -12px rgba(33, 76, 57, 0.35); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px;">
      <a href="tel:+15056394769" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1.5px solid #2F6B4F; border-radius: 999px; color: #214C39; font-size: 16px; font-weight: 700; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>Call now</a>
      <a href="New-Patients.dc.html#schedule" style="display: flex; align-items: center; justify-content: center; min-height: 48px; background: #2F6B4F; border-radius: 999px; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">Schedule an Assessment</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;iop&quot;,&quot;fr&quot;,&quot;online&quot;,&quot;individual&quot;,&quot;team&quot;,&quot;about&quot;,&quot;patients&quot;,&quot;faq&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1200, open: false, hover: null };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); this.pad(); }
  componentDidUpdate() { this.pad(); }
  pad() { document.body.style.paddingBottom = this.state.w < 1120 ? '76px' : ''; }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); clearTimeout(this.t); }
  renderVals() {
    const active = this.props.active ?? '';
    const defs = [
      { k: 'services', label: 'Our Services', href: 'Home.dc.html#services', match: ['iop', 'fr', 'online', 'individual'], children: [
        { k: 'iop', label: 'Substance Abuse Program (IOP)', sub: '16-week intensive outpatient program', href: 'IOP-Programs.dc.html' },
        { k: 'fr', label: 'First Responder Group', sub: 'Peers only · Tue & Thu mornings', href: 'First-Responder-Group.dc.html' },
        { k: 'online', label: 'Online Therapy', sub: 'Secure video anywhere in New Mexico', href: 'Online-Therapy.dc.html' },
        { k: 'individual', label: 'Individual Therapy', sub: 'One-on-one, in office or online', href: 'Individual-Therapy.dc.html' }
      ] },
      { k: 'about', label: 'About Us', href: 'About.dc.html', match: ['about', 'team', 'careers'], children: [
        { k: 'about', label: 'About New Growth', sub: 'Our mission and veteran-owned story', href: 'About.dc.html' },
        { k: 'team', label: 'Meet Our Clinicians', sub: 'Credentials and specialties', href: 'Our-Team.dc.html' },
        { k: 'careers', label: 'Careers', sub: 'Now hiring NM licensed LPCCs', href: 'Careers.dc.html' }
      ] },
      { k: 'patients', label: 'New Patients', href: 'New-Patients.dc.html', match: ['patients'], children: [
        { k: 'patients', label: 'Insurance & Intake', sub: 'Accepted plans, step-by-step intake', href: 'New-Patients.dc.html' },
        { k: 'faq', label: 'FAQ', sub: 'Common questions answered', href: 'FAQ.dc.html' },
        { k: 'pay', label: 'Pay Online', sub: 'Secure patient portal', href: 'https://www.therapyportal.com/p/therapy38/login/' }
      ] },
      { k: 'faq', label: 'FAQ', href: 'FAQ.dc.html', match: ['faq'], children: [] },
      { k: 'blog', label: 'Blog', href: 'Blog.dc.html', match: ['blog'], children: [] }
    ];
    const setHover = (k) => { clearTimeout(this.t); if (this.state.hover !== k) this.setState({ hover: k }); };
    const clear = () => { clearTimeout(this.t); this.t = setTimeout(() => this.setState({ hover: null }), 140); };
    const groups = defs.map(g => {
      const isActive = g.match.includes(active);
      const hasSub = g.children.length > 0;
      const open = hasSub && this.state.hover === g.k;
      return {
        label: g.label, href: g.href, hasSub, open, expanded: hasSub ? String(open) : undefined,
        current: isActive ? 'page' : undefined,
        children: g.children.map(c => ({ ...c, current: c.k === active ? 'page' : undefined })),
        enter: () => setHover(g.k), leave: clear,
        blur: (e) => { if (!e.currentTarget.contains(e.relatedTarget)) clear(); },
        chevron: { transition: 'transform .15s', transform: open ? 'rotate(180deg)' : 'none' },
        style: { display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 15.5, fontWeight: isActive ? 700 : 600, color: isActive || open ? '#2F6B4F' : '#1F2D27', textDecoration: 'none', padding: '8px 0', borderBottom: '2px solid ' + (isActive ? '#2F6B4F' : 'transparent') }
      };
    });
    const wide = this.state.w >= 1120;
    return { groups, wide, narrow: !wide, open: this.state.open, showPanel: !wide && this.state.open, toggle: () => this.setState(s => ({ open: !s.open })) };
  }
}
</script>
</body>
</html>
